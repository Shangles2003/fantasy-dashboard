# Fly.io config. `fly launch` will set the app name; keep the rest.
primary_region = "iad"

[build]

[env]
  FHQ_DATA_DIR = "/data"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the machine running so scores keep refreshing even when nobody has the page open
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "60s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Persistent disk for config.json, Yahoo token, CBS baseline and the Sleeper player cache
[mounts]
  source = "fhq_data"
  destination = "/data"
