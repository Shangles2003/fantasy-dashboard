# Runs the dashboard plus Caddy, which gets a free HTTPS certificate automatically.
# Used by deploy/setup-vm.sh. Needs DOMAIN and FHQ_PASSWORD in deploy/.env
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      FHQ_DATA_DIR: /data
      PORT: "8080"
      FHQ_PASSWORD: ${FHQ_PASSWORD}
    volumes:
      - fhq_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  fhq_data:
  caddy_data:
  caddy_config:
